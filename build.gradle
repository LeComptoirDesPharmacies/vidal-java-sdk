plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'fr.lecomptoirdespharmacies'
version = '0.2.11'

dependencies {
    // `api`: these were `compile` dependencies, consumers (the monolith) see them on their
    // compile classpath through the published POM, as before.
    api 'org.apache.commons:commons-lang3:3.5'
    api 'javax.xml.bind:jaxb-api:2.3.0'
    api 'com.sun.xml.bind:jaxb-impl:2.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.2.0'
}

java {
    // Built on JDK 21, bytecode kept at Java 8 as it has always been published.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

javadoc {
    options.encoding = 'UTF-8'
    // The sources predate javadoc linting: do not fail the javadoc jar on it.
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'vidal-java-sdk'
            from components.java

            pom {
                name = 'vidal-java-sdk'
                packaging = 'jar'
                description = 'Java SDK for Vidal REST API'
                url = 'https://github.com/LeComptoirDesPharmacies/vidal-java-sdk'

                organization {
                    name = 'Le Comptoir Des Pharmacies'
                    url = 'https://www.lecomptoirdespharmacies.fr/'
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'http://www.opensource.org/licenses/mit-license.php'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'git@github.com:LeComptoirDesPharmacies/vidal-java-sdk.git'
                    connection = 'scm:git@github.com:LeComptoirDesPharmacies/vidal-java-sdk.git'
                    developerConnection = 'scm:git:git@github.com:LeComptoirDesPharmacies/vidal-java-sdk.git'
                }

                developers {
                    developer {
                        id = 'gery.thrasibule'
                        name = 'Gery THRASIBULE'
                        email = 'webmaster@lecomptoirdespharmacies.fr'
                    }
                }
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            username = System.getenv('SONATYPE_USERNAME') ?: ''
            password = System.getenv('SONATYPE_PASSWORD') ?: ''
        }
    }
}

signing {
    def signingKey = System.getenv('GPG_SECRET_KEY')
    def signingPassword = System.getenv('GPG_PASSPHRASE')
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

tasks.withType(Sign).configureEach {
    onlyIf { System.getenv('GPG_SECRET_KEY') != null }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}
